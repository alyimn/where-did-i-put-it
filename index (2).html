<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Where Did I Put It?</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app-shell"><header><p class="eyebrow">A simple place to remember</p><h1>Where did I put it?</h1><p>Save an item and its location, then find it when you need it.</p></header>
<section id="home-screen" class="screen"><button class="action-card" type="button" data-open="find-screen"><b>⌕ &nbsp; Find an Item</b><small>Search for where something is.</small></button><button class="action-card" type="button" data-open="add-screen"><b>＋ &nbsp; Add an Item</b><small>Save an item and its location.</small></button></section>
<section id="find-screen" class="screen hidden"><button class="back" type="button" data-home>← Home</button><h2>Find an item</h2><form id="find-form" novalidate><label for="search-item">What are you looking for?</label><input id="search-item" name="item" placeholder="For example: Fan"><button class="primary">Find item</button></form><div id="find-result" class="message" role="status"></div></section>
<section id="add-screen" class="screen hidden"><button class="back" type="button" data-home>← Home</button><h2>Add an item</h2><form id="add-form" novalidate><label for="item-name">Item name</label><input id="item-name" name="item" placeholder="For example: Fan"><label for="item-location">Where did you put it?</label><input id="item-location" name="location" placeholder="For example: Bedroom"><button class="primary">Save item</button></form><div id="add-result" class="message" role="status"></div></section></main>
<dialog id="duplicate-dialog"><h2>Item already saved</h2><p id="duplicate-copy"></p><div class="dialog-actions"><button class="secondary" id="keep-old" type="button">Keep old location</button><button class="primary" id="replace-location" type="button">Replace location</button></div></dialog><script src="app.js"></script></body></html>
